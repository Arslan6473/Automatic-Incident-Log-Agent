[project]
name = "logagent"
version = "0.1.0"
description = "Automatic Incident & Log Agent - ML/AI engineering course project"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "imbalanced-learn",
    "matplotlib",
    "seaborn",
    "lightgbm",
    "shap",
    "optuna",
    "mlflow",
    "jupyter",
    "nbconvert",
    "onnx>=1.23.2",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.31.0",
    "skl2onnx>=1.20.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logagent"]
